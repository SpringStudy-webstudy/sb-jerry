server:
  port: ${PORT:8080}

spring:
  application:
    name: "umc-springboot-study"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false


  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE

  jackson:
    serialization:
      write-dates-as-timestamps: false



jwt:
  token:
    secretKey: ${JWT_SECRET}
    expiration:
      access: 14400000
